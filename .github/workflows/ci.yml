name: CI

on:
  pull_request:
    branches: [main, release, 'release/**']

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment
        uses: ./.github/actions/project/prepare-env

      - name: Check formatting
        working-directory: FinanceManager
        run: sbt scalafmtCheckAll

  test:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment
        uses: ./.github/actions/project/prepare-env

      - name: Run tests
        working-directory: FinanceManager
        run: sbt test
